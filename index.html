<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kellas Andrei - AI Fullstack Web Developer </title>
  <link rel="icon" type="image/jpeg" href="/img/drei.jpg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />
  <script>
    // Runs before first paint so the correct theme is already applied when the
    // page renders — otherwise the dark default flashes before React hydrates.
    // Must mirror App.tsx's initial useState logic exactly.
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var theme = (saved === 'dark' || saved === 'light')
          ? saved
          : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        var root = document.documentElement;
        root.setAttribute('data-mode', theme);
        if (theme === 'light') root.classList.add('light-mode');
      } catch (e) {
        // Storage blocked (private mode) — fall through to the CSS default.
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
