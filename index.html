<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Kellas Andrei - AI Fullstack Web Developer </title>
  <link rel="icon" type="image/png" href="/img/drei.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />
  <meta name="color-scheme" content="light dark" />
  <script>
    // Runs before first paint so a saved choice is applied before anything
    // renders. With no saved choice, data-theme stays unset and the CSS follows
    // prefers-color-scheme, so there is nothing to flash.
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        if (saved === 'dark' || saved === 'light') {
          document.documentElement.setAttribute('data-theme', saved);
        }
      } catch (e) {
        // Storage blocked (private mode) — the system setting applies.
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
